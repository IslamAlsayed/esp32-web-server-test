<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم في الليدات</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(15, 23, 42, 0.75);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", "Tajawal", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #334155 0%, transparent 40%),
                  radial-gradient(circle at 80% 90%, #1d4ed8 0%, transparent 40%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(650px, 100%);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      text-align: center;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
    }

    .lights {
      display: grid;
      gap: 14px;
    }

    .light-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .light-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .green { color: #22c55e; }
    .yellow { color: #facc15; }
    .red { color: #ef4444; }

    .switch {
      position: relative;
      width: 54px;
      height: 30px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #334155;
      border-radius: 999px;
      transition: 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      right: 3px;
      top: 3px;
      background: #f8fafc;
      border-radius: 50%;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: #0ea5e9;
    }

    .switch input:checked + .slider::before {
      transform: translateX(-24px);
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .send-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      min-width: 180px;
    }

    .reset-btn {
      background: rgba(148, 163, 184, 0.18);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    #status {
      margin-top: 16px;
      text-align: center;
      min-height: 24px;
      font-weight: 700;
    }

    .ok { color: var(--success); }
    .err { color: var(--danger); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>لوحة التحكم في الليدات</h1>
    <p class="subtitle">اختر حالة كل ليد ثم اضغط إرسال</p>

    <section class="lights">
      <article class="light-row">
        <div class="light-info"><span class="dot green"></span>Green LED</div>
        <label class="switch" aria-label="Green LED toggle">
          <input id="greenToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </article>

      <article class="light-row">
        <div class="light-info"><span class="dot yellow"></span>Yellow LED</div>
        <label class="switch" aria-label="Yellow LED toggle">
          <input id="yellowToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </article>

      <article class="light-row">
        <div class="light-info"><span class="dot red"></span>Red LED</div>
        <label class="switch" aria-label="Red LED toggle">
          <input id="redToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </article>
    </section>

    <div class="actions">
      <button class="send-btn" id="sendBtn" type="button">إرسال الحالة</button>
      <button class="reset-btn" id="resetBtn" type="button">إيقاف الكل</button>
    </div>

    <p id="status" aria-live="polite"></p>
  </main>

  <script>
    const FEED_URL = "https://io.adafruit.com/api/v2/islamalsayed/feeds/light/data";
    const AIO_KEY = "aio_QGVY00xmoovC2gDREa1flAJKc6jG";

    const greenToggle = document.getElementById("greenToggle");
    const yellowToggle = document.getElementById("yellowToggle");
    const redToggle = document.getElementById("redToggle");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusEl = document.getElementById("status");

    function getLightsState() {
      return {
        green: greenToggle.checked ? 1 : 0,
        yellow: yellowToggle.checked ? 1 : 0,
        red: redToggle.checked ? 1 : 0
      };
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    async function sendLightsState() {
      const lightsState = getLightsState();
      sendBtn.disabled = true;
      setStatus("جاري الإرسال...", "");

      try {
        const response = await fetch(FEED_URL, {
          method: "POST",
          headers: {
            "X-AIO-Key": AIO_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ value: JSON.stringify(lightsState) })
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        setStatus("تم إرسال حالة الليدات بنجاح ✅", "ok");
      } catch (error) {
        console.error(error);
        setStatus("حدث خطأ أثناء الإرسال ❌", "err");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function resetAll() {
      greenToggle.checked = false;
      yellowToggle.checked = false;
      redToggle.checked = false;
      setStatus("تم إيقاف جميع الليدات", "");
    }

    sendBtn.addEventListener("click", sendLightsState);
    resetBtn.addEventListener("click", resetAll);
  </script>
</body>
</html>
